# Render Blueprint - deploys the backend, frontend, and a Postgres database
# from this one repo. In the Render dashboard: New -> Blueprint -> pick this
# repo -> it reads this file and provisions everything below. See the
# README's "Publishing this live" section for the full walkthrough,
# including which env vars need a real value entered by hand (marked
# `sync: false`).
databases:
  - name: marketai-db
    plan: free

services:
  - type: web
    name: marketai-backend
    runtime: node
    plan: free
    rootDir: app/backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # set this by hand in the Render dashboard - never commit a real key
      - key: ADMIN_TOKEN
        generateValue: true # Render generates a random secret - view it in the dashboard's Environment tab to use the Disputes/arbitrator page
      - key: JWT_SECRET
        generateValue: true # signs wallet sign-in sessions - Render-generated, no action needed
      - key: DATABASE_URL
        fromDatabase:
          name: marketai-db
          property: connectionString
      - key: CORS_ORIGIN
        fromService:
          name: marketai-frontend
          type: web
          property: host # bare hostname (Render appends a -xxxx suffix if "marketai-frontend" is taken) - see index.ts for the scheme normalization
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: MARKETPLACE_PROGRAM_ID
        value: Byjh8A9Zir4PXUPUDJufmC6xoii5LN9W2omdt5D9LUuw
      - key: PLATFORM_FEE_BPS
        value: "200" # 2% - taken only when a sale completes, see pricingService.ts
      - key: USDC_MINT
        value: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU # devnet USDC; use the mainnet mint in production
      - key: TREASURY_WALLET
        sync: false # set this to your real treasury wallet - see README "Economics"

  - type: web
    name: marketai-frontend
    runtime: static
    rootDir: app/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: marketai-backend
          type: web
          property: host # bare hostname (Render appends a -xxxx suffix if "marketai-backend" is taken) - see api/client.ts for the scheme normalization
      - key: VITE_USDC_MINT
        value: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
      - key: VITE_TREASURY_WALLET
        sync: false # must match the backend's TREASURY_WALLET above
    routes:
      # React Router uses client-side routing - unknown paths (e.g.
      # /listing/abc on a hard refresh) must still serve index.html.
      - type: rewrite
        source: /*
        destination: /index.html
